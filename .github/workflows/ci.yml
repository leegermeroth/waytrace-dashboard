name: Dashboard CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests, production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `tsc -b && vite build` — the same command Cloudflare Pages runs, so a type
      # error or build break is caught before it can auto-deploy from main.
      - name: Production build
        run: npm run build
